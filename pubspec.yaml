name: musicxx_extern_plugin
description: "musicxx 外部插件框架 Dart 侧：加载/管理 C++ 与 JS 插件，派发钩子，转发接口。"
# 版本号 = 插件框架版本，格式 `<年>.<月日>.<小版本号>`（见 lib/src/version.dart）。
# 与 src/include/musicxx_extern_plugin_api.h 的 MUSICXX_EXTERN_PLUGIN_VERSION 保持一致。
version: 2026.1023.1
homepage: https://github.com/coolight7/mymusic
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  # 跨边界内存与函数指针（唯一运行时依赖；耗时工作都在原生插件框架里）
  ffi: ^2.1.4
  # 插件界面描述层（模型 / 解析 / 适配 / 文本降级 / kit；随包内子模块一起构建）
  pluginxx_ui:
    path: src/third_party/cxx_pluginxx_ui/dart
  # 多目标打包的分支目录与路径拼接（lib/src/plugin_target.dart，主程序安装预检也用它）
  path: ^1.9.0

dev_dependencies:
  # 由 src/include/musicxx_extern_plugin_api.h 生成 lib/src/bindings_generated.dart
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# 说明：
# 本包声明的 Flutter 平台（Windows / Linux / Android）**不参与 Flutter 编译**：
# 原生插件框架库由包内 tools/build_native.ps1（Windows）/ tools/build_native.sh（Linux/macOS 与
# Android 交叉编译）独立构建（superbuild 结构）；`windows/CMakeLists.txt`、
# `linux/CMakeLists.txt` 只负责把已构建好的库交给 Flutter 随应用分发（PLUGIN_BUNDLED_LIBRARIES），
# Android 由 `android/build.gradle` 把库收集进 jniLibs（打进 APK 的 lib/<abi>/，见 android/README.md），
# macOS 由**主程序** macos/ 的 Runner 构建阶段（musicxx-extern-plugin → tools/copy_extern_plugin_dylib.sh）
# 复制进 musicxx.app 的 Contents/Frameworks（macOS 的 Flutter 插件走 CocoaPods，包内没有可用的挂载点，
# 所以这一步不在本包里），Dart 侧再按显式路径/可执行文件目录/应用包/库名加载它（显式路径优先）。
# iOS 同样由**主程序** ios/ 的 Runner 构建阶段完成（ios/tool/embed_extern_plugin_dylib.sh → 复制到
# Runner.app/Frameworks 并用当前签名身份补签；iOS 只允许加载应用包内、与主程序同一签名身份的库），
# 原生库由 `tools/build_native.sh --ios | --ios-simulator` 交叉编译（只能在 macOS 上构建，见 README.md）。
# OHOS 的打包尚未接入（只跑 JS插件）。
flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      android:
        ffiPlugin: true
