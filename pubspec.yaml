name: musicxx_extern_plugin
description: "musicxx 外部插件宿主 Dart 侧：加载/管理 C++ 与 JS 插件，派发钩子，转发接口。"
version: 1.0.0
homepage: https://github.com/coolight7/mymusic
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  # 跨边界内存与函数指针（唯一运行时依赖；耗时工作都在原生宿主里）
  ffi: ^2.1.4

dev_dependencies:
  # 由 src/include/musicxx_extern_plugin_api.h 生成 lib/src/bindings_generated.dart
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 端到端用例里拼插件目录/配置文件路径用（只在包内测试里用）
  path: ^1.9.0

# 说明：
# 本包声明的 Flutter 平台（Windows / Linux / Android）**不参与 Flutter 编译**：
# 原生宿主库由包内 tools/build_native.ps1（Windows）/ tools/build_native.sh（Linux/macOS 与
# Android 交叉编译）独立构建（superbuild 结构）；`windows/CMakeLists.txt`、
# `linux/CMakeLists.txt` 只负责把已构建好的库交给 Flutter 随应用分发（PLUGIN_BUNDLED_LIBRARIES），
# Android 由 `android/build.gradle` 把库收集进 jniLibs（打进 APK 的 lib/<abi>/，见 android/README.md），
# Dart 侧再按显式路径/可执行文件目录/库名加载它（显式路径优先，便于打包与调试）。
# macOS / iOS / OHOS 的打包尚未接入。
flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      android:
        ffiPlugin: true
