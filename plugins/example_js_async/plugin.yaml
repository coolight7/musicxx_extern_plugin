# 对照示例（JS 插件）：裁决型钩子的处理器返回 Promise（异步裁决）
#
# 它演示的是「插件晚一点再给裁决」时插件框架的行为：Promise 结算后裁决生效；
# 插件框架一直等到结算为止（没有超时，也不会按「无裁决」继续），迟到的说法在这条路径上不存在。
# 由于它会改变拖动进度/音量的裁决结果，只用于演示与原生测试，不要装到日常使用的环境里。
# 这两个钩子当前版本主程序还没有接入（约定已固定）：示例由原生测试直接派发它们来验证插件框架行为。
name: example_js_async
kind: js
entry: plugin.js

version: 2026.1010.1
# 这一项只对按 C 接口编译的形态做下限判定（动态库插件）；JS 由内置运行器解释执行，保持 1
api_version: 1
