# 对照示例（JS 插件）：裁决型能力的处理器返回 Promise（异步裁决）
#
# 它演示的是「插件晚一点再给裁决」时插件框架的行为：Promise 结算后裁决生效；
# 插件框架一直等到结算为止（没有超时，也不会按「无裁决」继续）。
# 两条能力（`musicxx.player.seek` / `musicxx.player.volume`）主程序**都已接入**，
# 所以装上它会真的改拖动目标位置（改到 12.345 秒）与音量（拦下改音量）。
# 它只用于演示与原生测试，**不要装到日常使用的环境里**。
name: example_js_async
kind: js
entry: plugin.js

version: 2026.1010.1
# JS 接口代次：当前 3、兼容下限 3（2026-11 广播只剩读与订阅后抬的，写 1 / 2 加载会被拒）
api_version: 3
author: "coolight"
description: "对照示例: 裁决型能力处理器返回 Promise, 演示异步裁决(结算后裁决生效, 会真的改拖动与音量)"
platforms: [windows, linux, macos, android, ios]

