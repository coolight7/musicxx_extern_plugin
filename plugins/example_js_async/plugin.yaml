# 对照示例（JS 插件）：裁决型钩子的处理器返回 Promise（异步裁决）
#
# 它演示的是「插件晚一点再给裁决」时宿主的行为：Promise 结算后裁决生效；
# 宿主一直等到结算为止（没有超时，也不会按「无裁决」继续），迟到的说法在这条路径上不存在。
# 由于它会改变拖动进度/音量的裁决结果，只用于演示与原生测试，不要装到日常使用的环境里。
name: example_js_async
kind: js
entry: plugin.js

version: 1.0.0
api_version: 1
author: "coolight"
description: "对照示例: 裁决型钩子处理器返回 Promise, 演示异步裁决(结算后裁决生效)"
platforms: [windows, linux, macos, android, ios]

permissions: []
