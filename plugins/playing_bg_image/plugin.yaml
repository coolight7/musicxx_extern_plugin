name: playing_bg_image
kind: js
entry: plugin.js
# 脚本按顺序在同一个 JS 上下文里执行: 先加载两个界面 kit (随插件目录分发), 再加载插件脚本
scripts: [pluginxx_ui_kit.js, musicxx_ui_kit.js, plugin.js]

version: 20261010.1.0
api_version: 1
author: "coolight"
description: "示例封面背景 (playing_bg_image): 三种播放页背景模式 —— 1) 封面高斯模糊后放大、缓慢四处移动 (模糊程度 0~30、放大倍数 1~3 可在插件设置页调, 热浪扭曲密而快); 2) 封面主色做渐变底 + 贴边封面卡片 (竖屏贴上/左/右、横屏贴左/上/下, 自由边模糊渐隐) + 按主题的亮暗遮罩; 3) 黑胶唱片 —— 封面主色铺底, 中间一张黑胶盘 (音轨纹路 + 左上方柔光), 盘心圆裁当前封面并缓慢旋转 (转速 0.5×/1×/2× 可调), 盘沿上方一支白色唱臂 (转轴圆钮 + 折线臂管 (肘部圆角过渡) + 贴着盘沿的一小段唱头壳, 周围一圈很软的淡阴影, 轻拟物) 压在盘面外圈; 三种模式都能开关热浪扭曲波纹, 『隐藏歌曲图』默认关, 并自带封面取色算法 (统计封面里最多的 4 个色点); 另有『自动调整前景色』(默认开): 按封面取色的主色结合亮暗主题推出一套播放页前景色 (普通色/减淡色/块状背景色), 保留主色的色相与彩色程度 (文字是主色的深浅版), 并按当前模式估出的背景亮度保证对比度, 换歌、换模式与主题切换后自动更新"
platforms: [windows, linux, macos, android, ios]

permissions:
  - musicxx.ui
  - musicxx.library.read
  - musicxx.storage
