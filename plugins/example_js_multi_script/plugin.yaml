# 示例（JS 插件）：清单 `scripts` 多脚本加载
#
# 演示「一个插件目录里放多个脚本」：插件框架在同一个 JS 上下文里按 `scripts` 的顺序执行，
# 前一个脚本定义的全局量在后一个里可见（随插件分发的 kit 就是走这条路加载）。
# 任一脚本报错都算加载失败，扫描阶段缺文件也会提示。
name: example_js_multi_script
kind: js
scripts: [kit.js, plugin.js]

version: 2026.1010.1
# JS 接口代次：当前 3、兼容下限 3（2026-11 广播只剩读与订阅后抬的，写 1 / 2 加载会被拒）
api_version: 3
author: "coolight"
description: "示例: 多脚本加载 —— scripts 列表按顺序执行, 前一个脚本定义的全局量在后一个里可见"
platforms: [windows, linux, macos, android, ios]
