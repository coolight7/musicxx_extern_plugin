# 示例（JS 插件）：广播（`musicxx.broadcast`）
#
# 演示插件侧能做的四件事：声明并发布自己的频道、声明一个共享频道（`publish: anyone`）、
# 订阅官方频道、给高频频道声明自己的通知频率（`intervalMs` / `mode`）。
# 能力处理器不能返回 Promise（跨边界不支持异步返回值），所以这里把订阅结果记在变量里，
# 由 probe 能力回报 —— 原生测试与包内整套流程测试都读这几个字段。
name: example_js_broadcast
kind: js
entry: plugin.js

version: 2026.1010.1
# JS 接口代次：当前 3、兼容下限 3（2026-11 广播只剩读与订阅后抬的，写 1 / 2 加载会被拒）
api_version: 3
author: "coolight"
description: "示例: 广播 —— 声明并发布频道 + 订阅官方频道（含通知频率）"
platforms: [windows, linux, macos, android, ios]

permissions:
  - musicxx.broadcast
