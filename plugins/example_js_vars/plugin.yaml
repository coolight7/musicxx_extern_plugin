# 示例（JS 插件）：变量通道（`musicxx.vars`）
#
# 演示插件侧能做的三件事：登记自己的变量（declared / handler 两种模式）、绑定官方变量、
# 异步读写官方变量（读由宿主向应用取真值，写由应用落地后回执）。
# 能力处理器不能返回 Promise（跨边界不支持异步返回值），所以这里把异步结果记在变量里，
# 由 probe 能力回报 —— 原生测试与包内端到端测试都读这几个字段。
name: example_js_vars
kind: js
entry: plugin.js

version: 1.0.0
api_version: 1
author: "coolight"
description: "示例: 变量通道 —— 登记插件变量 + 读写与绑定官方变量"
platforms: [windows, linux, macos, android, ios]

permissions:
  - musicxx.variables
