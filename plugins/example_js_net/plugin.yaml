# 演示插件框架**内置的网络能力**: HTTP 客户端 / HTTP 服务端 / TCP 客户端 / TCP 服务 /
# WebSocket 客户端 / WebSocket 服务。全部只监听回环 (127.0.0.1)，端口由系统分配。
# 载入后会自动跑一遍自检（本机起服务 → 本机客户端连上去 → 回包比对），日志里能直接看到结果。
name: example_js_net
kind: js
entry: plugin.js
version: 2026.1024.1
# 这一项只对按 C 接口编译的形态做下限判定（动态库插件）；JS 由内置运行器解释执行，保持 1
api_version: 1
author: "musicxx"
description: "演示插件框架内置网络能力：HTTP / TCP / WebSocket 的客户端与服务端"
platforms: [windows, linux, macos, android, ios]
permissions:
  - musicxx.net
