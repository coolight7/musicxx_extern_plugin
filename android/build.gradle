// musicxx_extern_plugin 的 Android 平台工程（Flutter FFI 插件）
//
// 与 windows/CMakeLists.txt、linux/CMakeLists.txt 同一套路：插件框架库不是普通的"插件源码编译"，
// 而是一条独立的依赖链。本文件做三件事：
//   1. 本次构建要打包的每个 ABI 都调一次包内构建脚本的自动模式（与桌面端 tools/cmake/host_autobuild.cmake
//      同一套路）：脚本自己判断"已是最新就秒退"还是"只重编改过的源文件" —— 改过 C++ 之后不必手工跑
//      tools/build_native.ps1，下一次 `flutter build apk` / `flutter run` 就会带上新库
//      （关掉: -PmusicxxExternPluginAutoBuild=false 或环境变量 MUSICXX_EXTERN_PLUGIN_AUTO_BUILD=0）；
//   2. 按约定目录找到"已经构建好的"各 ABI 插件框架库；
//   3. 把它们收集进 jniLibs，随 Flutter 的 Android 构建打进 APK 的 `lib/<abi>/`。
//
// 为什么要打进 APK：Android 7(API 24) 起，动态链接器只允许应用从 APK 的原生库目录
// （以及系统目录）加载动态库，应用数据目录里的 .so 会以
// `is not accessible for the namespace "classloader-namespace"` 失败 —— 用户装的动态库插件
// 因此可能在设备上加载失败（插件框架按"安全降级"处理，不影响其它插件与主程序）。
//
// 手工构建插件框架库（可选：想把开发编译环境与重型依赖库先编好、或排查构建问题时用；每个 ABI 一次，
// 产物在 <包>/.native/output/android-<abi>-<配置>/bin/）：
//   pwsh -NoProfile -File tools/build_native.ps1 -Android -Abi arm64-v8a
//   pwsh -NoProfile -File tools/build_native.ps1 -Android -Abi arm64-v8a -Config Debug
//
// 找不到插件框架库时只打警告、不中断构建：外部插件是可选功能，缺失时主程序照常启动，
// 由 Dart 侧给出"插件框架库缺失"的提示（ExternPluginStore.lastError 与管理页状态区）。
//
// 显式指定库目录（CI/自定义目录）：
//   -PmusicxxExternPluginLibDir=<目录>   或环境变量 MUSICXX_EXTERN_PLUGIN_ANDROID_LIB_DIR
//   该目录的布局是 `<abi>/libmusicxx_extern_plugin.so`（<abi> 取 arm64-v8a / armeabi-v7a / x86_64 / x86）
//   （显式指定时自动构建不再执行：用哪份库已经由调用方决定）

import org.gradle.process.ExecOperations

import javax.inject.Inject

// ==================== 插件框架构建任务类型 ====================
//
// 起子进程要用注入的 ExecOperations：Gradle 9 已经移除 Project.exec，providers.exec 又不允许
// 直接透传子进程输出（"Standard streams cannot be configured for exec output provider"），
// 而交叉编译要跑几分钟，输出必须实时打到构建日志里。
abstract class MusicxxExternPluginBuildHostTask extends DefaultTask {

    // 要依次执行的构建计划（每条 = 一个 ABI 的构建脚本调用与该 ABI 的产物路径）。
    // 任务本身不判断"要不要重建"：包内构建脚本的自动模式自己判断（已是最新则秒退，源文件改过则增量重编）。
    private List<Map> plans = []

    @Internal
    List<Map> getPlans() { return plans }

    void setPlans(List<Map> value) { plans = value }

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void buildHost() {
        plans.each { Map plan ->
            List<String> command = plan.command as List<String>
            File library = new File(plan.library as String)
            long before = library.isFile() ? library.lastModified() : 0L
            logger.lifecycle("[musicxx_extern_plugin] 确保插件框架库最新（${plan.abi} ← 原生配置 ${plan.config}）：" +
                    "${command.join(' ')}")
            try {
                def result = execOperations.exec {
                    commandLine command
                    ignoreExitValue = true
                    // 构建过程很长，子进程输出直接透传（不要攒到最后再打）
                    standardOutput = System.out
                    errorOutput = System.err
                }
                if (result.exitValue != 0) {
                    logger.quiet("[musicxx_extern_plugin] ${plan.abi} 的插件框架库构建失败（退出码 ${result.exitValue}），" +
                            "本次构建的 APK 里还是旧的那份（缺失时就是没有）：外部插件的表现可能和源码对不上。\n" +
                            "  命令: ${command.join(' ')}\n" +
                            "  手工排查: pwsh -NoProfile -File tools/build_native.ps1 -Android -Abi ${plan.abi}" +
                            " -Config ${plan.config}")
                } else if (!library.isFile()) {
                    logger.quiet("[musicxx_extern_plugin] ${plan.abi} 的插件框架库构建结束但产物不在: ${library}\n" +
                            "  手工构建: pwsh -NoProfile -File tools/build_native.ps1 -Android -Abi ${plan.abi}" +
                            " -Config ${plan.config}")
                } else if (library.lastModified() != before) {
                    logger.quiet("[musicxx_extern_plugin] 插件框架库就绪（${plan.abi} ← ${plan.config}，" +
                            "本次已重建）: ${library}")
                } else {
                    logger.quiet("[musicxx_extern_plugin] 插件框架库就绪（${plan.abi} ← ${plan.config}，" +
                            "已是最新）: ${library}")
                }
            } catch (Exception error) {
                logger.quiet("[musicxx_extern_plugin] 插件框架库自动构建没能执行: ${error.message}")
            }
        }
    }
}

group = 'com.musicxx.extern_plugin'
version = '1.0'

apply plugin: 'com.android.library'

// ==================== 插件框架库定位 ====================

// 包根目录（本文件在 <包>/android/ 下）
def packageRoot = file("${projectDir}/..")
// 仓库根目录（主程序的 resource/libs/ 里可能预置了库，与 libmediaxx.so 同一约定）
def repoRoot = file("${packageRoot}/../..")
def libFileName = 'libmusicxx_extern_plugin.so'
// 原生构建的配置只有 Debug / Release 两种（构建脚本的 -Config）
def androidConfigs = ['Debug', 'Release']

// 显式目录：项目属性优先，其次环境变量
def explicitLibDir = null
if (project.hasProperty('musicxxExternPluginLibDir')) {
    explicitLibDir = file(project.property('musicxxExternPluginLibDir'))
} else if (System.getenv('MUSICXX_EXTERN_PLUGIN_ANDROID_LIB_DIR')) {
    explicitLibDir = file(System.getenv('MUSICXX_EXTERN_PLUGIN_ANDROID_LIB_DIR'))
}

// 构建脚本对某个 ABI / 原生配置的产物路径（脚本写在这里，Dart 侧与打包都读这个目录）
def outputLibraryOf = { String abi, String config ->
    new File("${packageRoot}/.native/output/android-${abi}-${config.toLowerCase()}/bin/${libFileName}")
}

// 该 ABI 在某个原生配置下的候选路径（顺序与 Dart 侧 native_library.dart 一致：
// 便携输出目录 → 构建目录里的安装前缀 → 仓库预置目录）
def candidatesOf = { String abi, String config ->
    List<File> list = []
    if (explicitLibDir != null) {
        list.add(new File(explicitLibDir, "${abi}/${libFileName}"))
    }
    list.add(outputLibraryOf(abi, config))
    list.add(new File("${packageRoot}/.native/build/android-${abi}-${config.toLowerCase()}/musicxx-extern-plugin-install/bin/${libFileName}"))
    list.add(new File("${repoRoot}/resource/libs/android/${abi}/${libFileName}"))
    return list
}

// 扫描出来的可用 ABI（两个配置的并集；.native/output 与 .native/build 都看）
def discoverAbis = {
    Set<String> abis = new LinkedHashSet<>()
    if (explicitLibDir != null && explicitLibDir.isDirectory()) {
        explicitLibDir.listFiles().each { f ->
            if (f.isDirectory() && new File(f, libFileName).isFile()) {
                abis.add(f.name)
            }
        }
    }
    ['output', 'build'].each { String kind ->
        androidConfigs.each { String config ->
            File base = new File("${packageRoot}/.native/${kind}")
            if (!base.isDirectory()) {
                return
            }
            String suffix = "-${config.toLowerCase()}"
            base.listFiles().each { f ->
                String name = f.name
                if (name.startsWith('android-') && name.endsWith(suffix)) {
                    String abi = name.substring('android-'.length(), name.length() - suffix.length())
                    if (abi) {
                        abis.add(abi)
                    }
                }
            }
        }
    }
    return abis.toList()
}

// Flutter 传给 Gradle 的目标平台（`-Ptarget-platform=android-arm64,android-x64`）→ ABI
// 只收集本次构建真正要用的 ABI：`flutter run`/`--target-platform` 指定单 ABI 时，
// 不必把其它 ABI 的插件框架库也塞进这个 APK（每份约 3 MB）。没有这个属性（直接用 Gradle 构建）
// 时不做限制，收集全部已构建的 ABI。
def platformToAbi = [
        'android-arm'  : 'armeabi-v7a',
        'android-arm64': 'arm64-v8a',
        'android-x64'  : 'x86_64',
]
def requestedAbis = null
if (project.hasProperty('target-platform')) {
    Set<String> list = new LinkedHashSet<>()
    project.property('target-platform').toString().split(',').each { String item ->
        String abi = platformToAbi[item.trim()]
        if (abi != null) {
            list.add(abi)
        }
    }
    if (!list.isEmpty()) {
        requestedAbis = list
    }
}

// 找到某个 ABI 的库与它在哪个原生配置下：先按本次的配置找，再退到另一种配置（与 linux/CMakeLists.txt
// 一致：Profile 不是原生构建的配置，按 Release 处理；只有一种配置的产物时就用它）
def resolveLibrary = { String abi, String config ->
    List<String> order = [config] + androidConfigs.findAll { it != config }
    for (String c : order) {
        for (File candidate : candidatesOf(abi, c)) {
            if (candidate.isFile()) {
                return [config: c, file: candidate]
            }
        }
    }
    return null
}

// 只要库文件（收集任务用）
def findLibrary = { String abi, String config ->
    def found = resolveLibrary(abi, config)
    return found == null ? null : (File) found.file
}

// 已经构建好的 ABI：按"库文件真的在"判断，而不是"目录存在"（目录还在、库被删掉时要能重新补上）
def builtAbisNow = {
    List<String> candidates = discoverAbis()
    Set<String> abis = new LinkedHashSet<>()
    androidConfigs.each { String config ->
        candidates.each { String abi ->
            if (findLibrary(abi, config) != null) {
                abis.add(abi)
            }
        }
    }
    return abis.toList().sort()
}

def builtAbis = builtAbisNow()
def targetAbis = (requestedAbis == null) ? builtAbis : requestedAbis.toList()

// ==================== 插件框架库自动构建（每次构建按需增量刷新） ====================
//
// 让 `flutter build apk` / `flutter run` 既不必先手工交叉编译插件框架库，也不必先手工重编改过的 C++：
// 本次构建要打包的每个 ABI 都调一次包内构建脚本的自动模式，脚本自己判断"已是最新就秒退"
// （秒级返回、不重新编译）还是"走一遍增量构建"（只重编改过的源文件）。
//
// 关掉自动构建（任一即可）:
//   -PmusicxxExternPluginAutoBuild=false     或环境变量 MUSICXX_EXTERN_PLUGIN_AUTO_BUILD=0
// 原生配置默认 Release（Debug 原生产物是另一整条依赖链，只有显式指定才构建）:
//   -PmusicxxExternPluginConfig=Debug        或环境变量 MUSICXX_EXTERN_PLUGIN_CONFIG=Debug
def autoBuildEnabled = {
    if (explicitLibDir != null) {
        return false   // 显式指定了库目录: 用哪份库已经由调用方决定, 不再自动构建
    }
    if (project.hasProperty('musicxxExternPluginAutoBuild') &&
            project.property('musicxxExternPluginAutoBuild').toString().toLowerCase() in ['0', 'false', 'off', 'no']) {
        return false
    }
    String env = System.getenv('MUSICXX_EXTERN_PLUGIN_AUTO_BUILD')
    if (env != null && env.toLowerCase() in ['0', 'false', 'off', 'no']) {
        return false
    }
    return true
}

def autoBuildConfig = {
    String configured = null
    if (project.hasProperty('musicxxExternPluginConfig')) {
        configured = project.property('musicxxExternPluginConfig').toString()
    } else if (System.getenv('MUSICXX_EXTERN_PLUGIN_CONFIG')) {
        configured = System.getenv('MUSICXX_EXTERN_PLUGIN_CONFIG')
    }
    return (configured != null && configured.equalsIgnoreCase('Debug')) ? 'Debug' : 'Release'
}

// 构建脚本的解释器（Windows 用 pwsh/powershell，其它系统用 bash）。探测要起一个进程，
// 因此只探一次并把结果留在 scriptShell 里，后面每个 ABI 直接复用。
def scriptShell = [resolved: false, name: null]
def resolveScriptShell = {
    if (scriptShell.resolved) {
        return scriptShell.name
    }
    scriptShell.resolved = true
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        for (String shell in ['pwsh', 'powershell']) {
            try {
                def probe = new ProcessBuilder(shell, '-NoProfile', '-Command', 'exit 0').redirectErrorStream(true).start()
                probe.inputStream.text
                if (probe.waitFor() == 0) {
                    scriptShell.name = shell
                    break
                }
            } catch (IOException ignored) {
                // 这个解释器不存在：试下一个
            }
        }
    } else {
        scriptShell.name = 'bash'   // Linux / macOS 上按约定有 bash
    }
    return scriptShell.name
}

// 构建脚本的调用方式；找不到解释器时返回 null
def resolveScriptCommand = { String config, String abi ->
    String shell = resolveScriptShell()
    File toolsDir = new File(packageRoot, 'tools')
    if (shell == null) {
        return null
    }
    if (shell == 'bash') {
        return ['bash', new File(toolsDir, 'build_native.sh').absolutePath,
                '--auto', '--config', config, '--android', '--abi', abi]
    }
    return [shell, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            new File(toolsDir, 'build_native.ps1').absolutePath,
            '-Auto', '-Config', config, '-Android', '-Abi', abi,
            // Gradle 按系统代码页解码子进程输出，这里跟着用系统代码页写
            '-ConsoleEncoding', 'system']
}

// 本次要保证"最新"的构建计划（每个目标 ABI 一条）:
//   - 已经有库的 ABI: 用打包时会用到的那份原生配置刷新（库可能只是旧了, 要不要重编由脚本判断）;
//   - 还没有库的 ABI: 用配置的原生配置做首次构建（与"缺库就补"的行为一致）。
// 计划在配置期算好（目标 ABI 由 Flutter 传下来的 target-platform 决定）；真正的"要不要重编"由脚本在执行期判断。
def buildPlansOf = { String nativeConfig ->
    List<Map> plans = []
    targetAbis.each { String abi ->
        def found = resolveLibrary(abi, nativeConfig)
        String config = (found == null) ? autoBuildConfig() : (String) found.config
        List<String> command = resolveScriptCommand(config, abi)
        if (command == null) {
            logger.warn("[musicxx_extern_plugin] 没找到 PowerShell / bash, 跳过 ${abi} 的插件框架库自动构建;" +
                    " 手工构建: pwsh -NoProfile -File tools/build_native.ps1 -Android -Abi ${abi}")
            return
        }
        plans.add([abi: abi, config: config, command: command,
                   library: outputLibraryOf(abi, config).absolutePath])
    }
    return plans
}

def stagingRoot = new File(project.layout.buildDirectory.get().asFile, 'musicxxExternPluginJniLibs')

android {
    namespace = 'com.musicxx.extern_plugin'
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 本模块没有源码，只有预编译的插件框架库（jniLibs 由下面的收集任务写入）
    buildFeatures {
        buildConfig = false
    }
}

// ==================== 收集到 jniLibs ====================
//
// 每个 build type 一个收集目录与一个任务：
//   - 目录 <模块构建目录>/musicxxExternPluginJniLibs/<build type>/<abi>/libmusicxx_extern_plugin.so
//     注册成该 build type 的 jniLibs 源目录（Debug 构建只带 Debug 产物，不会混用）；
//   - 任务在该 build type 的 preBuild 之前执行（merge<Variant>JniLibFolders 依赖 preBuild），
//     因此 AGP 合并、打包时库已经在位。
android.buildTypes.all { buildType ->
    String typeName = buildType.name
    String nativeConfig = typeName.toLowerCase().contains('debug') ? 'Debug' : 'Release'
    File staging = new File(stagingRoot, typeName)
    String taskName = "syncMusicxxExternPluginJniLibs${typeName.capitalize()}"

    // 该 build type 只收集自己这一份（Debug/Release 各自独立，避免把 Debug 库打进 Release 包）
    android.sourceSets.maybeCreate(typeName).jniLibs.srcDir(staging)

    // 每次构建都先调一次包内构建脚本（它自己判断"已是最新就秒退"还是"增量重编"），再收集；
    // 关掉见上面的 autoBuildEnabled
    def autoBuildTask = tasks.register("buildMusicxxExternPluginHost${typeName.capitalize()}",
            MusicxxExternPluginBuildHostTask) {
        group = 'flutter'
        description = "确保 Android 插件框架库最新（${typeName}：调包内构建脚本，已是最新则秒退）"
        outputs.upToDateWhen { false }
        if (!autoBuildEnabled()) {
            boolean missing = targetAbis.any { String abi -> findLibrary(abi, nativeConfig) == null }
            logger.lifecycle("[musicxx_extern_plugin] 插件框架库自动构建已关闭" +
                    "（musicxxExternPluginAutoBuild=false）：本次只收集已经存在的库" +
                    (missing ? "，缺少的 ABI 不会自动补" : ""))
            return
        }
        plans = buildPlansOf(nativeConfig)
    }

    def syncTask = tasks.register(taskName) {
        group = 'flutter'
        description = "收集 Android 插件框架库到 jniLibs（${typeName} ← 原生配置 ${nativeConfig}）"
        // 先确保库是最新的，再收集（本次刚重建出来的库才会被收进这个 APK）
        dependsOn(autoBuildTask)
        outputs.dir(staging)
        outputs.upToDateWhen { false }
        doLast {
            // 执行期重新判断哪些 ABI 有库: 构建脚本可能刚把它们补齐
            def abisNow = builtAbisNow()
            List<String> packageAbisNow = targetAbis.findAll { abisNow.contains(it) }
            // 先清掉上一次的结果：删掉不再构建的 ABI，避免旧库被误打进包
            project.delete(staging)
            List<String> copied = []
            packageAbisNow.each { String abi ->
                File source = findLibrary(abi, nativeConfig)
                if (source == null) {
                    return
                }
                File abiDir = new File(staging, abi)
                abiDir.mkdirs()
                project.copy {
                    from(source)
                    into(abiDir)
                }
                copied.add("${abi} ← ${source}")
            }
            if (copied.isEmpty()) {
                logger.warn("[musicxx_extern_plugin] 未找到 Android 插件框架库（${libFileName}，原生配置 ${nativeConfig}），" +
                        "本次构建的 APK 里不会有它：外部插件功能在设备上不可用。\n" +
                        "  构建: pwsh -NoProfile -File tools/build_native.ps1 -Android -Abi <abi>" +
                        "（可选 -Config Debug）\n" +
                        "  需要的 ABI: ${targetAbis.join('、')}\n" +
                        "  候选: ${candidatesOf(targetAbis.isEmpty() ? 'arm64-v8a' : targetAbis[0], nativeConfig).join(' | ')}")
            } else {
                logger.lifecycle("[musicxx_extern_plugin] 插件框架库随 APK 分发（${typeName}）：")
                copied.each { logger.lifecycle("  ${it}") }
                def stillMissing = targetAbis.findAll { !packageAbisNow.contains(it) }
                if (!stillMissing.isEmpty()) {
                    logger.lifecycle("  未构建的 ABI（这些设备上外部插件不可用）：${stillMissing.join('、')}")
                }
            }
        }
    }

    // preBuild 先跑收集；显式连一次，避免依赖 AGP 内部任务顺序的假设
    String preBuildName = "pre${typeName.substring(0, 1).toUpperCase()}${typeName.substring(1)}Build"
    tasks.matching { it.name == preBuildName }.configureEach {
        dependsOn(autoBuildTask)
        dependsOn(syncTask)
    }
}
